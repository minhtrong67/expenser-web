  <meta name="color-scheme" content="light dark" />
  <!-- Status bar / title bar colour: follows the OS until the script below applies the saved in-app theme -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

  <!--
      Pre-React paint that follows the light/dark theme (never a wrong-coloured flash).
      Keep colours in sync with SPLASH in src/theme/index.js and .splash in src/index.css.
    -->
  <style>
    html { background: #ffffff; color-scheme: light; }
    .splash { position: relative; display: flex; min-height: 100dvh; align-items: center; justify-content: center; background: #ffffff; }
    .splash-logo { width: 6rem; height: 6rem; user-select: none; -webkit-user-drag: none; }
    .splash-spinner { position: absolute; top: calc(50% + 5rem); left: 50%; width: 1.5rem; height: 1.5rem; margin-left: -0.75rem; border-radius: 9999px; border: 2px solid rgb(0 130 54 / 0.2); border-top-color: #008236; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html { background: #0a0a0a; color-scheme: dark; }
      .splash { background: #0a0a0a; }
      .splash-spinner { border-color: rgb(0 201 80 / 0.25); border-top-color: #00c950; }
    }
    html.light { background: #ffffff; color-scheme: light; }
    html.light .splash { background: #ffffff; }
    html.light .splash-spinner { border-color: rgb(0 130 54 / 0.2); border-top-color: #008236; }
    html.dark { background: #0a0a0a; color-scheme: dark; }
    html.dark .splash { background: #0a0a0a; }
    html.dark .splash-spinner { border-color: rgb(0 201 80 / 0.25); border-top-color: #00c950; }
  </style>

  <!-- Applies the user's saved theme (and accent) before the stylesheet and React load. Mirrors SettingsContext. -->
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var s = JSON.parse(localStorage.getItem('qlct:settings') || '{}');
        var mode = s.themeMode || 'system';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.add(dark ? 'dark' : 'light');
        var a = JSON.parse(localStorage.getItem('qlct:accent') || 'null');
        if (a && a.hex === s.accentColor) root.style.cssText += ';' + (dark ? a.dark : a.light);
        // The in-app theme wins over the OS one: use a single colour.
        var color = dark ? '#0a0a0a' : '#ffffff';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.removeAttribute('media');
          m.setAttribute('content', color);
        });
        if (s.language === 'en') root.lang = 'en';
      } catch (e) {
        /* storage unavailable - the OS theme applies via prefers-color-scheme */
      }
    })();
  </script>
