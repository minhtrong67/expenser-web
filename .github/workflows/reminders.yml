# Calls /api/send-reminders every 10 minutes so daily reminders go out on time.
# Vercel's Hobby plan only allows one cron run per day, so a free external scheduler is used.
# Set the repository secrets REMINDER_URL (https://<your-app>/api/send-reminders) and CRON_SECRET.
name: Send daily reminders

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder endpoint
        env:
          REMINDER_URL: ${{ secrets.REMINDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$REMINDER_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "REMINDER_URL / CRON_SECRET not set - skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$REMINDER_URL"
