<style>
:root{
  --primary:#008236;--on-primary:#fff;--primary-container:#E6F3EB;--on-primary-container:#008236;
  --secondary:#525252;--secondary-container:#EFEFEF;--on-secondary-container:#0A0A0A;
  --tertiary:#737373;--tertiary-container:#F5F5F5;--on-tertiary-container:#0A0A0A;
  --surface:#FFFFFF;--on-surface:#0A0A0A;--on-surface-variant:#737373;
  --sc-low:#FAFAFA;--sc:#F5F5F5;--sc-high:#EFEFEF;--sc-highest:#E5E5E5;
  --outline:#D4D4D4;--outline-variant:#E5E5E5;
  --income:#008236;--income-container:#E6F3EB;--on-income-container:#006B2D;
  --expense:#E7000B;--expense-container:#FDE6E7;--on-expense-container:#B80009;
  --hov:.06;--prs:.08;--ease:cubic-bezier(.2,0,0,1);--ease-d:cubic-bezier(.05,.7,.1,1);
  --radius:10px;
  --elev1:0 1px 2px rgb(0 0 0/.05);
  --elev2:0 4px 12px -2px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.06);
  --elev3:0 16px 40px -8px rgb(0 0 0/.2),0 4px 10px -4px rgb(0 0 0/.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;background:var(--surface);color:var(--on-surface);line-height:1.5;overflow-x:hidden;transition:background .3s var(--ease),color .3s var(--ease)}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
section{position:relative;padding:clamp(56px,9vw,104px) 0}

/* ---- buttons ---- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--radius);font-weight:500;font-size:15px;transition:background .2s,transform .2s var(--ease),opacity .2s}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;transition:opacity .2s}
.btn:hover::before{opacity:var(--hov)}.btn:active::before{opacity:var(--prs)}
.btn:active{transform:scale(.98)}
.btn-filled{background:var(--primary);color:var(--on-primary)}
.btn-tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn-outlined{border:1px solid var(--outline);color:var(--on-surface)}
.btn-sm{height:36px;padding:0 14px;font-size:14px}
.icon-btn{width:36px;height:36px;border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;color:var(--on-surface-variant);transition:background .2s,color .2s}
.icon-btn:hover{background:var(--sc);color:var(--on-surface)}

/* ---- nav ---- */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;padding-top:env(safe-area-inset-top);border-bottom:1px solid transparent;transition:background .3s,border-color .3s}
.nav.scrolled{background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(12px);border-color:var(--outline-variant)}
.nav-in{display:flex;align-items:center;height:60px;gap:8px}
.brand{font-size:19px;font-weight:700;color:var(--on-surface);letter-spacing:-.01em;margin-right:auto}
.links{display:flex;gap:2px;margin-right:12px}
.links a{padding:6px 12px;border-radius:var(--radius);font-size:14px;font-weight:500;color:var(--on-surface-variant);transition:background .2s,color .2s}
.links a:hover{background:var(--sc);color:var(--on-surface)}
.lang{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 10px;border-radius:var(--radius);font-weight:500;font-size:14px;color:var(--on-surface-variant);transition:background .2s,color .2s}
.lang:hover{background:var(--sc);color:var(--on-surface)}

/* ---- hero ---- */
.hero{padding-top:calc(60px + clamp(40px,7vw,88px))}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;position:relative}
.chip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--outline-variant);background:var(--sc-low);color:var(--on-surface-variant);font-size:13px;font-weight:500}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--income)}
h1{font-size:clamp(36px,6vw,62px);line-height:1.06;font-weight:700;letter-spacing:-.03em;margin:20px 0}
h1 em{font-style:normal;color:var(--primary)}
.lead{font-size:clamp(16px,2vw,18px);color:var(--on-surface-variant);max-width:520px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.badges{display:flex;flex-wrap:wrap;gap:20px;margin-top:32px;color:var(--on-surface-variant);font-size:13px}
.badges span{display:inline-flex;align-items:center;gap:6px}
.badges svg{color:var(--primary)}

/* phone mockup */
.stage{position:relative;display:flex;justify-content:center}
.phone{width:min(290px,78vw);aspect-ratio:9/18.5;border-radius:36px;background:var(--surface);border:1px solid var(--outline);box-shadow:var(--elev3);padding:18px 14px;overflow:hidden}
.ph-top{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--on-surface);font-size:15px;margin-bottom:12px}
.ph-card{border-radius:14px;padding:16px;background:var(--primary-container);color:var(--on-primary-container);border:1px solid color-mix(in srgb,var(--primary) 20%,transparent)}
.ph-card small{font-size:11px;opacity:.8}
.ph-card b{display:block;font-size:24px;letter-spacing:-.01em}
.ph-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ph-mini{border-radius:12px;padding:10px 12px;font-size:11px}
.ph-mini b{display:block;font-size:14px}
.in{background:var(--income-container);color:var(--on-income-container)}
.out{background:var(--expense-container);color:var(--on-expense-container)}
.bars{display:flex;align-items:flex-end;gap:6px;height:84px;margin:14px 2px 8px}
.bars i{flex:1;border-radius:4px 4px 2px 2px;background:var(--primary);transform-origin:bottom;transform:scaleY(0);animation:grow 1s var(--ease-d) forwards}
.bars i:nth-child(even){opacity:.55}
@keyframes grow{to{transform:scaleY(1)}}
.ph-li{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:12px;animation:slide .6s var(--ease-d) both}
.ph-li .d{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sc);font-size:14px}
.ph-li span{flex:1}.ph-li b{font-variant-numeric:tabular-nums}
@keyframes slide{from{opacity:0;transform:translateY(14px)}}
.float-card{position:absolute;background:var(--surface);border:1px solid var(--outline-variant);border-radius:12px;padding:10px 14px;box-shadow:var(--elev2);font-size:12px;display:flex;align-items:center;gap:10px}
.float-card.f1{left:0;top:18%}.float-card.f2{right:0;bottom:16%}
.float-card .ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}

/* ---- reveal ---- */
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease-d),transform .6s var(--ease-d);transition-delay:var(--d,0s)}
.rv.show{opacity:1;transform:none}

/* ---- headings ---- */
.eyebrow{font-size:14px;font-weight:600;color:var(--primary)}
h2{font-size:clamp(26px,4vw,40px);line-height:1.15;font-weight:700;letter-spacing:-.025em;margin:8px 0 14px}
.sub{color:var(--on-surface-variant);font-size:clamp(15px,1.8vw,17px);max-width:620px}
.center{text-align:center}.center .sub{margin-inline:auto}

/* ---- features ---- */
.grid{display:grid;gap:16px;margin-top:48px}
.g3{grid-template-columns:repeat(3,1fr)}
.card{position:relative;border-radius:16px;padding:24px;background:var(--surface);border:1px solid var(--outline-variant);transition:border-color .25s,background .25s}
.card:hover{border-color:var(--outline);background:var(--sc-low)}
.card .ic{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;background:var(--primary-container);color:var(--on-primary-container)}
.card h3{font-size:17px;font-weight:600;margin-bottom:6px}
.card p{color:var(--on-surface-variant);font-size:15px}

/* ---- showcase ---- */
.showcase{background:var(--sc-low);border-block:1px solid var(--outline-variant)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.swatches{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 8px}
.sw{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .25s var(--ease-d),box-shadow .25s}
.sw:hover{transform:scale(1.1)}
.sw.on{box-shadow:0 0 0 3px var(--sc-low),0 0 0 5px var(--primary)}
.sw svg{opacity:0;transform:scale(.4);transition:.25s var(--ease-d)}.sw.on svg{opacity:1;transform:none}
.hint{font-size:13px;color:var(--on-surface-variant)}
.panel{border-radius:16px;background:var(--surface);border:1px solid var(--outline-variant);padding:20px;box-shadow:var(--elev1)}
.pn-head{display:flex;gap:6px;margin-bottom:16px}
.pn-head i{width:9px;height:9px;border-radius:50%;background:var(--outline-variant)}
.seg{display:flex;gap:4px;padding:4px;border-radius:var(--radius);background:var(--sc);margin-bottom:14px}
.seg div{flex:1;display:flex;align-items:center;justify-content:center;height:32px;border-radius:7px;font-size:13px;font-weight:500;color:var(--on-surface-variant)}
.seg .act{background:var(--surface);color:var(--on-surface);box-shadow:var(--elev1)}
.field{border:1px solid var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent);border-radius:8px;padding:8px 14px;margin-bottom:10px}
.field small{font-size:11px;color:var(--primary);display:block}
.field b{font-size:20px;font-variant-numeric:tabular-nums}
.pn-sug{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pn-sug span{height:30px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;border:1px solid var(--outline-variant);background:var(--surface)}
.pn-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pn-chips span{height:30px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;font-size:12px;font-weight:500;border:1px solid var(--outline-variant);color:var(--on-surface-variant)}
.pn-chips .sel{background:var(--primary-container);color:var(--on-primary-container);border-color:color-mix(in srgb,var(--primary) 40%,transparent)}
.pn-btn{height:42px;border-radius:var(--radius);background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px}

/* ---- steps ---- */
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.step{position:relative;padding:28px 24px;border-radius:16px;background:var(--surface);border:1px solid var(--outline-variant)}
.step::before{counter-increment:s;content:counter(s);display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:var(--primary);color:var(--on-primary);font-weight:600;margin-bottom:16px}
.step h3{font-size:17px;font-weight:600;margin-bottom:6px}.step p{color:var(--on-surface-variant);font-size:15px}

/* ---- stats ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:8px}
.stat{border-radius:16px;padding:24px 16px;text-align:center;background:var(--sc-low);border:1px solid var(--outline-variant)}
.stat b{display:block;font-size:clamp(30px,4.6vw,44px);font-weight:700;line-height:1.1;letter-spacing:-.02em;color:var(--primary)}
.stat span{font-size:14px;color:var(--on-surface-variant)}

/* ---- tech / credit ---- */
.tech{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}
.tech span{height:34px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;background:var(--sc-low);border:1px solid var(--outline-variant);font-size:14px;font-weight:500}
.credit{margin-top:48px;border-radius:16px;padding:clamp(22px,4vw,32px);background:var(--primary-container);border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);color:var(--on-primary-container)}
.credit .eyebrow{color:inherit}
.cr-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.cr{display:flex;align-items:center;gap:14px;border-radius:12px;padding:16px;background:var(--surface);border:1px solid var(--outline-variant)}
.cr .ic{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.cr small{color:var(--on-surface-variant);font-size:12px;display:block}
.cr b{font-size:20px;font-weight:700;color:var(--on-surface)}
.cr.a .ic{background:var(--primary);color:var(--on-primary)}
.cr.b .ic{background:var(--secondary-container);color:var(--on-surface)}

/* ---- final cta + footer ---- */
.final{text-align:center}
.final .box{border-radius:20px;padding:clamp(40px,7vw,72px) 24px;background:var(--primary);color:var(--on-primary)}
.final p{opacity:.85;max-width:520px;margin:0 auto 28px}
.final .btn{background:var(--on-primary);color:var(--primary)}
footer{padding:32px 0 calc(32px + env(safe-area-inset-bottom));text-align:center;color:var(--on-surface-variant);font-size:14px;border-top:1px solid var(--outline-variant)}

/* ---- responsive ---- */
@media(max-width:980px){
  .hero-grid,.split{grid-template-columns:1fr}
  .hero-grid{gap:56px}.hero .lead{max-width:none}
  .g3{grid-template-columns:repeat(2,1fr)}
  .links{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .split .panel-wrap{order:2}
}
@media(max-width:640px){
  .wrap{width:min(1120px,100% - 32px)}
  .g3,.steps,.cr-grid{grid-template-columns:1fr}
  .cta .btn{flex:1 1 100%}
  .float-card{display:none}
  .nav-in .btn{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>

};
const root=document.documentElement;
const KEY='expenser-landing';
let app={};try{app=JSON.parse(localStorage.getItem('qlct:settings'))||{}}catch(e){}
let own={};try{own=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const prefersDark=matchMedia('(prefers-color-scheme: dark)');
const state={
  lang:own.lang||app.language||((navigator.language||'vi').toLowerCase().startsWith('vi')?'vi':'en'),
  mode:own.mode||(app.themeMode&&app.themeMode!=='system'?app.themeMode:null),
  preset:own.preset||(Object.keys(PRESETS).find(k=>PRESETS[k].val.toLowerCase()===(app.accentColor||'').toLowerCase())||'green')
};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const kebab=s=>s.replace(/[A-Z]/g,m=>'-'+m.toLowerCase());
const MAP={sc:'surfaceContainer'};
function applyTheme(){
  const dark=state.mode?state.mode==='dark':prefersDark.matches;
  const p=PRESETS[state.preset][dark?'dark':'light'];
  const set=(n,k)=>root.style.setProperty('--'+n,p[k]);
  ['primary','onPrimary','primaryContainer','onPrimaryContainer','secondary','secondaryContainer','onSecondaryContainer','tertiary','tertiaryContainer','onTertiaryContainer','surface','onSurface','onSurfaceVariant','outline','outlineVariant','income','incomeContainer','onIncomeContainer','expense','expenseContainer','onExpenseContainer'].forEach(k=>set(kebab(k),k));
  root.style.setProperty('--on-primary',p.onPrimary);
  root.style.setProperty('--sc-low',p.surfaceContainerLow);root.style.setProperty('--sc',p.surfaceContainer);
  root.style.setProperty('--sc-high',p.surfaceContainerHigh);root.style.setProperty('--sc-highest',p.surfaceContainerHighest);
  root.style.colorScheme=dark?'dark':'light';
  root.style.setProperty('--hov',dark?'.05':'.06');root.style.setProperty('--prs',dark?'.07':'.08');
  document.querySelector('meta[name=theme-color]').content=p.surface;
  document.getElementById('modeUse').setAttribute('href',dark?'#i-sun':'#i-moon');
  document.querySelectorAll('.sw').forEach(b=>{const on=b.dataset.id===state.preset;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
}
function applyLang(){
  const d=I18N[state.lang];root.lang=state.lang;
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=d[el.dataset.i]});
  document.getElementById('langTxt').textContent=state.lang.toUpperCase();
  document.title=state.lang==='vi'?'Expenser — Quản lý chi tiêu cá nhân thông minh':'Expenser — Smart personal expense tracker';
  document.querySelectorAll('[data-count][data-fmt]').forEach(el=>{el.textContent=fmt(+el.dataset.count)});
}
const fmt=n=>n.toLocaleString(state.lang==='vi'?'vi-VN':'en-GB')+' ₫';

// swatches
const sw=document.getElementById('swatches');
Object.entries(PRESETS).forEach(([id,p])=>{
  const b=document.createElement('button');b.className='sw';b.dataset.id=id;b.style.background=p.seed;b.setAttribute('role','radio');b.setAttribute('aria-label',id);b.setAttribute('aria-checked','false');
  b.innerHTML='<svg width="22" height="22"><use href="#i-check"/></svg>';
  b.onclick=()=>{state.preset=id;save();applyTheme()};
  sw.appendChild(b);
});
document.getElementById('langBtn').onclick=()=>{state.lang=state.lang==='vi'?'en':'vi';save();applyLang()};
document.getElementById('modeBtn').onclick=()=>{const dark=state.mode?state.mode==='dark':prefersDark.matches;state.mode=dark?'light':'dark';save();applyTheme()};
prefersDark.addEventListener('change',()=>{if(!state.mode)applyTheme()});
applyTheme();applyLang();

// nav shadow
const nav=document.getElementById('nav');
const onScroll=()=>nav.classList.toggle('scrolled',scrollY>12);
addEventListener('scroll',onScroll,{passive:true});onScroll();

// reveal on scroll + count-up
const ease=t=>1-Math.pow(1-t,4);
function countUp(el){
  const target=+el.dataset.count,suf=el.dataset.suf||'',money=el.dataset.fmt,t0=performance.now(),dur=1400;
  (function tick(now){const p=Math.min((now-t0)/dur,1),v=Math.round(target*ease(p));el.textContent=money?fmt(v):v+suf;if(p<1)requestAnimationFrame(tick)})(t0);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;
  e.target.classList.add('show');
  e.target.querySelectorAll('[data-count]:not([data-fmt])').forEach(countUp);
  io.unobserve(e.target);
}),{threshold:.15,rootMargin:'0px 0px -40px 0px'});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
setTimeout(()=>document.querySelectorAll('[data-count][data-fmt]').forEach(countUp),500);
</script>
